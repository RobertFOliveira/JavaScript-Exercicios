<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <BOdy>

        <h2>JavaScript Instruções</h2>
    
    <p>Um <b>JavaScript programa</b> é uma lista de  <b>Instruções</b> a serem executadas por um computador.</p>
    
    <p id="demo"></p>
    
    <script>
    var x, y, z;  // Declare 3 variables
    x = 5;    // Assign the value 5 to x
    y = 6;    // Assign the value 6 to y
    z = x + y;  // Assign the sum of x and y to z
    
    document.getElementById("demo").innerHTML =
    "The value of z is " + z + ".";
    </script>
    
    </BOdy>
</body>
</html>
