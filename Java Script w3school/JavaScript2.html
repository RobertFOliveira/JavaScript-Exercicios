<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Strings</h2>

<p>Strings podem ser escritas com aspas duplas ou simples</p>

<p id="demo"></p>

<script>
document.getElementById("demo").innerHTML = 'John Doe';
</script>
<br><hr><br>

<h2>JavaScript Variáveis</h2>

<p>Neste exemplo, x é definido como uma variável. Então, x recebe o valor 6:</p>

<p id="demo"></p>

<script>
let x;
x = 6;
document.getElementById("demo").innerHTML = x;
</script>



</body>
</html>
